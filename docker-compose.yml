services:
  postgres:
    image: postgres:16
    container_name: airtel_b2b_sales_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airtel_sales_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-airtel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airtel_app} -d ${POSTGRES_DB:-airtel_sales_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
